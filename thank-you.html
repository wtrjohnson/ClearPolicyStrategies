<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thank You — Clear Policy Strategies</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy: #1B3A6B;
      --navy-dark: #0F2447;
      --red: #B8102A;
      --red-bright: #C8102E;
      --gold: #C9A84C;
      --white: #FFFFFF;
      --off-white: #F7F6F3;
      --light-gray: #EAEAEA;
      --text-dark: #1A1A2E;
      --text-mid: #4A4A6A;
    }

    body {
      font-family: 'Inter', sans-serif;
      color: var(--text-dark);
      background: var(--white);
      -webkit-font-smoothing: antialiased;
    }

    /* ── NAV ── */
    nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 0 48px;
      height: 88px;
      background: rgba(255, 255, 255, 0.97);
      backdrop-filter: blur(12px);
      border-radius: 0 0 20px 20px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 32px;
      list-style: none;
    }

    .nav-left a {
      font-size: 14px;
      font-weight: 500;
      color: var(--text-dark);
      text-decoration: none;
      transition: color 0.2s;
    }

    .nav-left a:hover { color: var(--navy); }

    .nav-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
    }

    .nav-logo img {
      height: 72px;
      width: auto;
      filter: brightness(0) saturate(100%) invert(19%) sepia(65%) saturate(600%) hue-rotate(205deg) brightness(90%);
    }

    .nav-right {
      display: flex;
      justify-content: flex-end;
      align-items: center;
    }

    .nav-cta {
      background: var(--red-bright);
      color: var(--white) !important;
      padding: 10px 24px;
      border-radius: 2px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-decoration: none;
      transition: background 0.2s;
    }

    .nav-cta:hover { background: #a50e26; }

    /* ── THANK YOU ── */
    .thankyou-section {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--navy-dark);
      padding: 120px 48px;
      position: relative;
    }

    .thankyou-inner {
      text-align: center;
      max-width: 560px;
    }

    .check-circle {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      border: 2px solid var(--gold);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 36px;
    }

    .thankyou-inner h1 {
      font-family: 'EB Garamond', serif;
      font-size: clamp(36px, 4vw, 52px);
      font-weight: 600;
      color: var(--white);
      line-height: 1.15;
      margin-bottom: 20px;
    }

    .thankyou-inner p {
      font-size: 17px;
      line-height: 1.8;
      color: rgba(255,255,255,0.6);
      margin-bottom: 44px;
    }

    .btn-secondary {
      display: inline-flex;
      align-items: center;
      padding: 14px 32px;
      background: transparent;
      color: var(--white);
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-decoration: none;
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 2px;
      transition: border-color 0.2s, background 0.2s;
    }

    .btn-secondary:hover {
      border-color: rgba(255,255,255,0.7);
      background: rgba(255,255,255,0.06);
    }

    /* ── FOOTER ── */
    footer {
      background: #080F1E;
      padding: 48px;
    }

    .footer-inner {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .footer-logo img {
      height: 60px;
      filter: brightness(0) invert(1);
      opacity: 0.7;
    }

    .footer-nav {
      display: flex;
      gap: 28px;
      list-style: none;
    }

    .footer-nav a {
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.45);
      text-decoration: none;
      transition: color 0.2s;
    }

    .footer-nav a:hover { color: rgba(255,255,255,0.8); }
    .footer-copy { font-size: 12px; color: rgba(255,255,255,0.3); }

    /* ── HAMBURGER / MOBILE NAV ── */
    .nav-hamburger {
      display: none;
      flex-direction: column;
      justify-content: space-between;
      width: 22px;
      height: 16px;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      margin-left: 16px;
    }
    .nav-hamburger span {
      display: block;
      height: 2px;
      width: 100%;
      background: var(--text-dark);
      border-radius: 2px;
      transition: transform 0.25s, opacity 0.2s;
    }
    .nav-hamburger[aria-expanded="true"] span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
    .nav-hamburger[aria-expanded="true"] span:nth-child(2) { opacity: 0; }
    .nav-hamburger[aria-expanded="true"] span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

    .nav-mobile-menu {
      display: none;
      position: fixed;
      top: 70px;
      left: 0;
      right: 0;
      background: rgba(255,255,255,0.98);
      backdrop-filter: blur(12px);
      padding: 8px 20px 28px;
      flex-direction: column;
      box-shadow: 0 8px 32px rgba(0,0,0,0.1);
      z-index: 99;
      border-radius: 0 0 20px 20px;
    }
    .nav-mobile-menu.open { display: flex; }
    .nav-mobile-menu a {
      display: block;
      padding: 16px 0;
      font-size: 15px;
      font-weight: 500;
      color: var(--text-dark);
      text-decoration: none;
      border-bottom: 1px solid var(--light-gray);
    }
    .nav-mobile-menu a:last-child { border-bottom: none; }
    .nav-mobile-cta {
      margin-top: 16px;
      padding: 14px 24px !important;
      background: var(--red-bright);
      color: var(--white) !important;
      text-align: center;
      border-radius: 2px;
      font-weight: 600 !important;
      letter-spacing: 0.04em;
      border-bottom: none !important;
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 768px) {
      nav { padding: 0 20px; height: 70px; border-radius: 0 0 14px 14px; }
      .nav-left { display: none; }
      .nav-cta { display: none; }
      .nav-hamburger { display: flex; }
      .nav-logo img { height: 56px; }

      .thankyou-section { padding: 100px 20px 60px; }

      footer { padding: 36px 20px; }
      .footer-inner { flex-direction: column; align-items: center; text-align: center; gap: 20px; }
      .footer-nav { flex-wrap: wrap; justify-content: center; }
    }

  </style>
</head>
<body>

  <!-- NAV -->
  <nav>
    <ul class="nav-left">
      <li><a href="about.html">About</a></li>
      <li><a href="practice-areas.html">Practice Areas</a></li>
    </ul>
    <a href="index.html" class="nav-logo">
      <img src="assets/images/Logo-nav.png" alt="Clear Policy Strategies" />
    </a>
    <div class="nav-right">
      <a href="contact.html" class="nav-cta">Contact Us</a>
      <button class="nav-hamburger" aria-label="Open navigation" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>
  <div class="nav-mobile-menu" id="nav-mobile-menu">
    <a href="about.html">About</a>
    <a href="practice-areas.html">Practice Areas</a>
    <a href="contact.html" class="nav-mobile-cta">Contact Us</a>
  </div>

  <!-- THANK YOU -->
  <section class="thankyou-section">
    <div class="thankyou-inner">
      <div class="check-circle">
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
          <path d="M6 14L11.5 19.5L22 9" stroke="#C9A84C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <h1>Thank You for<br />Reaching Out.</h1>
      <p>Your message has been received. We'll be in touch.</p>
      <a href="index.html" class="btn-secondary">Back to Home</a>
    </div>
  </section>

  <!-- FOOTER -->
  <footer>
    <div class="footer-inner">
      <div class="footer-logo">
        <img src="assets/images/Logo-traced.png" alt="Clear Policy Strategies" />
      </div>
      <ul class="footer-nav">
        <li><a href="index.html#about">About</a></li>
        <li><a href="practice-areas.html">Practice Areas</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
      <div class="footer-copy">&copy; 2025 Clear Policy Strategies. All rights reserved.</div>
    </div>
  </footer>

  <script>
    (function () {
      var btn  = document.querySelector('.nav-hamburger');
      var menu = document.getElementById('nav-mobile-menu');
      if (!btn || !menu) return;
      btn.addEventListener('click', function () {
        var open = menu.classList.toggle('open');
        btn.setAttribute('aria-expanded', open);
      });
      menu.querySelectorAll('a').forEach(function (a) {
        a.addEventListener('click', function () {
          menu.classList.remove('open');
          btn.setAttribute('aria-expanded', 'false');
        });
      });
      document.addEventListener('click', function (e) {
        if (!menu.contains(e.target) && !btn.contains(e.target)) {
          menu.classList.remove('open');
          btn.setAttribute('aria-expanded', 'false');
        }
      });
    })();
  </script>
</body>
</html>
