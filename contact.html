<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — Clear Policy Strategies</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy: #1B3A6B;
      --navy-dark: #0F2447;
      --red: #B8102A;
      --red-bright: #C8102E;
      --gold: #C9A84C;
      --white: #FFFFFF;
      --off-white: #F7F6F3;
      --light-gray: #EAEAEA;
      --text-dark: #1A1A2E;
      --text-mid: #4A4A6A;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inter', sans-serif;
      color: var(--text-dark);
      background: var(--white);
      -webkit-font-smoothing: antialiased;
    }

    /* ── NAV ── */
    nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 0 48px;
      height: 88px;
      background: rgba(255, 255, 255, 0.97);
      backdrop-filter: blur(12px);
      border-radius: 0 0 20px 20px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 32px;
      list-style: none;
    }

    .nav-left a {
      font-size: 14px;
      font-weight: 500;
      color: var(--text-dark);
      text-decoration: none;
      transition: color 0.2s;
    }

    .nav-left a:hover { color: var(--navy); }
    .nav-left a.active { color: var(--navy); font-weight: 600; }

    .nav-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
    }

    .nav-logo img {
      height: 72px;
      width: auto;
      filter: brightness(0) saturate(100%) invert(19%) sepia(65%) saturate(600%) hue-rotate(205deg) brightness(90%);
    }

    .nav-right {
      display: flex;
      justify-content: flex-end;
      align-items: center;
    }

    .nav-cta {
      background: var(--red-bright);
      color: var(--white) !important;
      padding: 10px 24px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-decoration: none;
      transition: background 0.2s;
    }

    .nav-cta:hover { background: #a50e26; }

    /* ── PAGE HEADER ── */
    .page-header {
      background: var(--navy-dark);
      padding: 160px 48px 80px;
      position: relative;
      overflow: hidden;
    }

    .page-header-inner {
      max-width: 800px;
      margin: 0 auto;
      text-align: center;
    }

    .page-eyebrow {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .page-eyebrow-line { width: 32px; height: 2px; background: var(--red-bright); }

    .page-eyebrow span {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.5);
    }

    .page-header h1 {
      font-family: 'EB Garamond', serif;
      font-size: clamp(40px, 4.5vw, 60px);
      font-weight: 600;
      color: var(--white);
      line-height: 1.1;
      margin-bottom: 24px;
    }

    .page-header p {
      font-size: 17px;
      line-height: 1.8;
      color: rgba(255,255,255,0.65);
    }

    /* ── CONTACT SECTION ── */
    .contact-section {
      padding: 100px 48px;
      background: var(--white);
    }

    .contact-inner {
      max-width: 600px;
      margin: 0 auto;
    }

    /* ── CONTACT FORM ── */
    .contact-form {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .form-group label {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--navy-dark);
    }

    .form-group input,
    .form-group textarea {
      padding: 14px 16px;
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      color: var(--text-dark);
      background: var(--white);
      border: 1px solid var(--light-gray);
      border-radius: 2px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-group input:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: var(--red-bright);
      box-shadow: 0 0 0 3px rgba(200, 16, 46, 0.1);
    }

    .form-group textarea {
      resize: vertical;
      min-height: 140px;
    }

    .form-submit {
      padding: 15px 32px;
      background: var(--red-bright);
      color: var(--white);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      border: none;
      border-radius: 2px;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
      align-self: flex-start;
      margin-top: 8px;
    }

    .form-submit:hover {
      background: #a50e26;
      transform: translateY(-1px);
    }

    .form-note {
      font-size: 12px;
      color: var(--text-mid);
      margin-top: 4px;
    }

    /* ── FOOTER ── */
    footer {
      background: #080F1E;
      padding: 48px;
    }

    .footer-inner {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .footer-logo img {
      height: 60px;
      filter: brightness(0) invert(1);
      opacity: 0.7;
    }

    .footer-nav {
      display: flex;
      gap: 28px;
      list-style: none;
    }

    .footer-nav a {
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.45);
      text-decoration: none;
      transition: color 0.2s;
    }

    .footer-nav a:hover { color: rgba(255,255,255,0.8); }
    .footer-copy { font-size: 12px; color: rgba(255,255,255,0.3); }

    .footer-credit {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 11px;
      color: rgba(255,255,255,0.5);
      text-decoration: none;
      transition: color 0.2s;
      cursor: pointer;
    }

    .footer-credit:hover {
      color: rgba(255,255,255,0.8);
    }

    .footer-credit img {
      height: 20px;
      width: auto;
      filter: brightness(0) invert(1);
      opacity: 0.7;
    }
  </style>
</head>
<body>

  <!-- NAV -->
  <nav>
    <ul class="nav-left">
      <li><a href="about.html">About</a></li>
      <li><a href="practice-areas.html">Practice Areas</a></li>
    </ul>
    <a href="index.html" class="nav-logo">
      <img src="Logo-nav.png" alt="Clear Policy Strategies" />
    </a>
    <div class="nav-right">
      <a href="contact.html" class="nav-cta">Contact Us</a>
    </div>
  </nav>

  <!-- PAGE HEADER -->
  <section class="page-header">
    <div class="page-header-inner">
      <div class="page-eyebrow">
        <div class="page-eyebrow-line"></div>
        <span>Contact</span>
      </div>
      <h1>Let's Talk.</h1>
      <p>
        Send a message and Aaron will respond within 24 business hours.
      </p>
    </div>
  </section>

  <!-- CONTACT FORM -->
  <section class="contact-section">
    <div class="contact-inner">
      <form class="contact-form" action="https://api.web3forms.com/submit" method="POST">
        <input type="hidden" name="access_key" value="49534368-6ce2-469c-a922-d5ee098517bb">
        <input type="hidden" name="redirect" value="thank-you.html">
        <div class="form-group">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" required />
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required />
        </div>

        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" name="message" placeholder="Tell us how we can help..." required></textarea>
        </div>

        <button type="submit" class="form-submit">Send Message</button>
        <p class="form-note">We respond within 24 business hours.</p>
      </form>
    </div>
  </section>

  <!-- FOOTER -->
  <footer>
    <div class="footer-inner">
      <div class="footer-logo">
        <img src="Logo-traced.png" alt="Clear Policy Strategies" />
      </div>
      <ul class="footer-nav">
        <li><a href="about.html">About</a></li>
        <li><a href="practice-areas.html">Practice Areas</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
      <div class="footer-copy">&copy; 2026 Clear Policy Strategies. All rights reserved.</div>
      <a href="https://pebblesprings.co" target="_blank" class="footer-credit">
        <span>Built by</span>
        <img src="PSLogo.svg" alt="Pebblesprings Studio" />
      </a>
    </div>
  </footer>

</body>
</html>
